site_name: AlloPep
site_description: GAPS-guided peptide design, physical validation, and Rosetta ranking.
repo_url: https://github.com/djmaity/allopep
repo_name: djmaity/allopep
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Usage and CLI: usage.md
  - Pipeline:
      - Pocket selection: pocket-selection.md
      - Sampling and resume: sampling-and-resume.md
      - Structure validation: validation.md
      - Rosetta ranking: scoring.md
  - Working with results:
      - Outputs and visualization: outputs.md
      - Troubleshooting: troubleshooting.md
      - Scientific interpretation: scientific-scope.md
  - Development: development.md
