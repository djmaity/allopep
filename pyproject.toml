[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "allopep"
version = "0.1.0"
description = "Pipeline for allosteric peptide design"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are managed by Conda in environment.yml.
dependencies = []

[project.scripts]
allopep = "allopep.__main__:run"

# GAPS/, PepGLAD/, tests/ and docs/ sit beside the package, so automatic
# discovery must be limited to the package itself.
[tool.setuptools.packages.find]
include = ["allopep*"]

# Width limits only: 79 columns for code, 72 for comments and
# docstrings. Ruff is used as a detector, never as a formatter, because
# a blanket reflow would rewrite lines that are already within the
# limits. The patched external checkouts are not ours to lint, and the
# normal-mode notebook is unused reference material.
[tool.ruff]
line-length = 79
extend-exclude = [
    "GAPS", "PepGLAD", "site", "normal_mode_analysis.ipynb",
]

[tool.ruff.lint]
select = ["E501", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
